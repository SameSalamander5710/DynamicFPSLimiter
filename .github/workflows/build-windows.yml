name: Build Windows

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          architecture: x64
          cache: pip
          cache-dependency-path: src/requirements.txt
      - name: Install dependencies
        run: python -m pip install -r src/requirements.txt
      - name: Run regression tests
        run: python -m unittest discover -s tests -v
      - name: Build executable
        run: python src/__main__.py --build
      - name: Check and package executable
        shell: python
        run: |
          from pathlib import Path
          import shutil
          from PyInstaller.archive.readers import CArchiveReader

          bundle = Path('output/dist/DynamicFPSLimiter')
          archive = CArchiveReader(str(bundle / 'DynamicFPSLimiter.exe'))
          modules = archive.open_embedded_archive('PYZ.pyz').toc
          for module in ('core.config_manager', 'core.idle_timer', 'core.rtss_functions'):
              assert module in modules, f'Missing bundled module: {module}'
          for asset in ('DynamicFPSLimiter.ico', 'faqs.csv', 'LHM_0.9.4_lib/net472/LibreHardwareMonitorLib.dll'):
              assert (bundle / '_internal/assets' / asset).is_file(), f'Missing asset: {asset}'
          shutil.make_archive('output/DynamicFPSLimiter-windows-x64', 'zip', 'output/dist')
      - uses: actions/upload-artifact@v7
        with:
          name: DynamicFPSLimiter-windows-x64
          path: output/DynamicFPSLimiter-windows-x64.zip
          if-no-files-found: error
